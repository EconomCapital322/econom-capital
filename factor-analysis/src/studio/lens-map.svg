<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- The channels encode opposing normals on each edge and a neutral center. -->
  <defs>
    <linearGradient id="x">
      <stop stop-color="#f20000"/>
      <stop offset=".075" stop-color="#800000"/>
      <stop offset=".925" stop-color="#800000"/>
      <stop offset="1" stop-color="#110000"/>
    </linearGradient>
    <linearGradient id="y" x2="0" y2="1">
      <stop stop-color="#00f200"/>
      <stop offset=".22" stop-color="#008000"/>
      <stop offset=".78" stop-color="#008000"/>
      <stop offset="1" stop-color="#001100"/>
    </linearGradient>
  </defs>
  <g style="isolation:isolate">
    <rect width="100" height="100" fill="url(#x)"/>
    <rect width="100" height="100" fill="url(#y)" style="mix-blend-mode:screen"/>
  </g>
</svg>
