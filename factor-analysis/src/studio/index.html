<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14192C">
  <title>Спектр · Аналитика финансовых рисков</title>
  <link rel="icon" type="image/svg+xml" href="/spectrum.svg">
  <link rel="preload" href="/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/studio.css">
  <script type="module" src="/studio.mjs"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-analysis" viewBox="0 0 24 24"><path d="M4 16h16M7 12h4m2-4h7M4 20V4"/></symbol>
    <symbol id="icon-scenarios" viewBox="0 0 24 24"><path d="m3 17 5-5 4 3 7-9m-4 0h4v4M4 21h16"/></symbol>
    <symbol id="icon-portfolio" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M3 12h18m-11 0v2h4v-2"/></symbol>
    <symbol id="icon-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol>
    <symbol id="icon-bars" viewBox="0 0 24 24"><path d="M12 4v16M4 8h8m0 4h8m-15 4h7"/></symbol>
    <symbol id="icon-waterfall" viewBox="0 0 24 24"><path d="M4 20v-6h3v6m3-8V8h3v4m3 4v-6h3v6m-12-5h3m3-2h3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v3h16v-3"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Zm8 0v5h4M9 13h6m-6 4h6"/></symbol>
    <symbol id="icon-box" viewBox="0 0 24 24"><path d="M4 7h16v13H4V7ZM3 3h18v4H3V3Zm7 9h4"/></symbol>
  </svg>
  <a class="skip" href="#content">К содержимому</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#analysis">
        <img src="/spectrum.svg" width="40" height="40" alt="">
        <span>Спектр<small>Аналитика финансовых рисков</small></span>
      </a>
      <nav aria-label="Разделы">
        <a href="#analysis" data-route="analysis"><svg class="icon" aria-hidden="true"><use href="#icon-analysis"/></svg>Факторный анализ</a>
        <a href="#scenarios" data-route="scenarios"><svg class="icon" aria-hidden="true"><use href="#icon-scenarios"/></svg>Стресс-сценарии</a>
        <a href="#portfolio" data-route="portfolio"><svg class="icon" aria-hidden="true"><use href="#icon-portfolio"/></svg>Портфель</a>
        <a href="#data" data-route="data"><svg class="icon" aria-hidden="true"><use href="#icon-data"/></svg>Данные и источники</a>
      </nav>
      <details class="services" open>
        <summary>Подключения</summary>
        <ul id="services" aria-live="polite"><li>Проверяем сервисы…</li></ul>
      </details>
    </aside>
    <div class="body">
      <header class="topbar">
        <div id="crumb">Рабочая область</div>
        <a href="#portfolio" data-action="new-run" class="button small primary"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>Новый расчёт</a>
      </header>
      <div class="alert-container" id="activity" aria-live="polite"></div>
      <main id="content" tabindex="-1"><p class="loading">Открываем последний расчёт…</p></main>
    </div>
  </div>
  <dialog id="factor-drawer" aria-labelledby="factor-title"></dialog>
  <dialog id="inspector" aria-labelledby="inspector-title"></dialog>
  <noscript>Включите JavaScript, чтобы открыть «Спектр».</noscript>
</body>
</html>
