<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F5F9">
  <title>Спектр · Аналитика финансовых рисков</title>
  <link rel="icon" type="image/svg+xml" href="/spectrum.svg">
  <link rel="preload" href="/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/studio.css">
  <script type="module" src="/studio.mjs"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v3h16v-3"/></symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  </svg>
  <a class="skip" href="#content">К содержимому</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="#analysis" data-action="overview">
        <svg class="brand-mark" width="29" height="29" viewBox="0 0 40 40" fill="none" aria-hidden="true" focusable="false">
          <rect width="40" height="40" rx="11" fill="#332D68"/>
          <path d="M7.5 26.5 18.5 19.9 32 10.5" stroke="#AEA5FF" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M7.5 26.5 18.5 19.9 32 20" stroke="#EEEAFE" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M7.5 26.5 18.5 19.9 32 29.5" stroke="#8074F3" stroke-width="1.75" stroke-linecap="round"/>
          <circle cx="18.5" cy="19.9" r="2" fill="#F6F3FF"/>
        </svg>
        <span>Спектр</span>
      </a>
      <nav aria-label="Разделы">
        <a href="#analysis" data-route="analysis" data-action="overview" aria-current="page">Анализ</a>
        <a href="#curves" data-route="curves">Кривые</a>
        <a href="#scenarios" data-route="scenarios">Сценарии</a>
        <a href="#portfolio" data-route="portfolio">Портфель</a>
        <a href="#data" data-route="data">Данные</a>
      </nav>
    </div>
  </header>
  <div class="alert-container" id="activity" aria-live="polite"></div>
  <main id="content" tabindex="-1">
    <div id="studio-screen"><p class="loading">Открываем последний расчёт…</p></div>
    <div id="curve-screen" hidden><p class="loading" role="status">Открываем кривые доходности…</p></div>
  </main>
  <dialog id="factor-drawer" aria-labelledby="factor-title"></dialog>
  <dialog id="assistant-drawer" aria-labelledby="assistant-title"></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="inspector" aria-labelledby="inspector-title"></dialog>
  <noscript>Включите JavaScript, чтобы открыть «Спектр».</noscript>
</body>
</html>
