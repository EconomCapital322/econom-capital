<!doctype html>
<html lang="ru" data-opening>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f8">
  <title>Спектр · Аналитика финансовых рисков</title>
  <link rel="icon" type="image/svg+xml" href="/spectrum.svg">
  <link rel="preload" href="/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/appearance.js"></script>
  <link rel="stylesheet" href="/studio.css">
  <link rel="stylesheet" href="/glass.css">
  <script type="module" src="/studio.mjs"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v3h16v-3"/></symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="icon-analysis" viewBox="0 0 24 24"><path d="M4 3.5v16h16M8 14v-3m4 3V7m4 4V5m4 8V8"/></symbol>
    <symbol id="icon-curves" viewBox="0 0 24 24"><path d="M3 19c5.5 0 6.3-8.3 11-10.5A12.7 12.7 0 0 1 21 7M3 15c6 0 9-2 12-6s4-5 6-5"/></symbol>
    <symbol id="icon-scenarios" viewBox="0 0 24 24"><path d="M3 12h7c4 0 4-6 7-6h4m-3-3 3 3-3 3m-8 3c4 0 4 6 7 6h4m-3-3 3 3-3 3"/></symbol>
    <symbol id="icon-portfolio" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M3 12a22 22 0 0 0 18 0m-9 0v3"/></symbol>
    <symbol id="icon-data" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 14h16M10 9v11"/></symbol>
    <symbol id="icon-layout" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M10 5v14m6-10-2.5 3 2.5 3"/></symbol>
    <symbol id="icon-appearance" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16m0-2.7a5.3 5.3 0 0 0 0-10.6Z"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <filter id="glass-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage href="/lens-map.svg" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="lens-normals"/>
      <feDisplacementMap in="SourceGraphic" in2="lens-normals" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <a class="skip" href="#content">К содержимому</a>
  <aside class="navigation-shell" aria-label="Рабочая область" data-glass="frosted">
      <a class="brand" href="#analysis" data-action="overview">
        <svg class="brand-mark" width="29" height="29" viewBox="0 0 40 40" fill="none" aria-hidden="true" focusable="false">
          <defs><linearGradient id="prism-fill" x1="13" y1="10" x2="25" y2="33" gradientUnits="userSpaceOnUse">
            <stop stop-color="#DBD6FF" stop-opacity=".62"/><stop offset="1" stop-color="#9280F2" stop-opacity=".12"/>
          </linearGradient></defs>
          <rect width="40" height="40" rx="10" fill="#29254F"/>
          <path class="prism-glass" d="M17.5 9 28 29H9.5Z" fill="url(#prism-fill)" stroke="#D3CBFF" stroke-opacity=".67" stroke-width=".75" stroke-linejoin="round"/>
          <g fill="none" stroke-width="1.5" stroke-linecap="round">
            <path class="prism-incoming" d="M4.8 22 19 19.5" pathLength="1" stroke="#F7F4FF"/>
            <path class="prism-outgoing" d="M19 19.5 34.7 13.5" pathLength="1" stroke="#A6DBE4"/>
            <path class="prism-outgoing" d="M19 19.5 35.1 21" pathLength="1" stroke="#C7B8FF"/>
            <path class="prism-outgoing" d="M19 19.5 33.7 29.4" pathLength="1" stroke="#E6ACCD"/>
          </g>
        </svg>
        <span>Спектр</span>
      </a>
      <nav class="workspace-nav" aria-label="Разделы" data-motion-track="navigation">
        <span class="selection-pill" aria-hidden="true"></span>
        <a href="#analysis" data-route="analysis" data-action="overview" aria-current="page" title="Анализ"><svg class="icon" aria-hidden="true"><use href="#icon-analysis"/></svg><span>Анализ</span></a>
        <a href="#curves" data-route="curves" title="Кривые доходности"><svg class="icon" aria-hidden="true"><use href="#icon-curves"/></svg><span>Кривые</span></a>
        <a href="#scenarios" data-route="scenarios" title="Сценарии"><svg class="icon" aria-hidden="true"><use href="#icon-scenarios"/></svg><span>Сценарии</span></a>
        <a href="#portfolio" data-route="portfolio" title="Портфель"><svg class="icon" aria-hidden="true"><use href="#icon-portfolio"/></svg><span>Портфель</span></a>
        <a href="#data" data-route="data" title="Данные"><svg class="icon" aria-hidden="true"><use href="#icon-data"/></svg><span>Данные</span></a>
      </nav>
      <div class="rail-footer">
        <button class="rail-action" type="button" data-action="commands" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" aria-label="Быстрые действия" title="Быстрые действия"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><span>Быстрые действия</span></button>
        <button class="rail-action" type="button" data-action="appearance" aria-haspopup="dialog" aria-label="Внешний вид" title="Внешний вид"><svg class="icon" aria-hidden="true"><use href="#icon-appearance"/></svg><span>Внешний вид</span></button>
        <button class="rail-action rail-toggle" type="button" id="rail-toggle" aria-label="Свернуть меню" aria-expanded="true" title="Свернуть меню"><svg class="icon" aria-hidden="true"><use href="#icon-layout"/></svg><span>Свернуть меню</span></button>
      </div>
  </aside>
  <div class="workspace">
    <header class="context-bar" data-glass="frosted">
      <div class="context-inner">
        <span id="page-location">Анализ</span>
        <span id="workspace-context" hidden></span>
        <button class="text-button service-link" type="button" data-action="service-status"><i aria-hidden="true"></i>Сервисы</button>
      </div>
    </header>
    <div class="alert-container" id="activity" aria-live="polite"></div>
    <main id="content" tabindex="-1">
      <div id="studio-screen"><div class="report-skeleton"><p class="loading" role="status">Открываем последний расчёт…</p><div class="skeleton-heading" aria-hidden="true"></div><div class="skeleton-report" aria-hidden="true"></div></div></div>
      <div id="curve-screen" hidden><p class="loading" role="status">Открываем кривые доходности…</p></div>
    </main>
  </div>
  <dialog id="factor-drawer" aria-labelledby="factor-title" data-glass="dense"></dialog>
  <dialog id="assistant-drawer" aria-labelledby="assistant-title" data-glass="dense"></dialog>
  <button id="assistant-restore" class="button assistant-button" type="button" data-action="restore-assistant" data-glass="clear" aria-controls="assistant-drawer" hidden><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg>Восстановить AI</button>
  <dialog id="command-palette" aria-labelledby="command-title" data-glass="dense">
    <h2 class="sr-only" id="command-title">Быстрые действия</h2>
    <div class="command-search"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
      <input type="search" role="combobox" aria-label="Поиск действий" aria-autocomplete="list" aria-expanded="true" aria-controls="command-list" autocomplete="off" placeholder="К разделу или действию…" autofocus>
      <form method="dialog"><button class="icon-button" aria-label="Закрыть быстрые действия" type="submit">Esc</button></form>
    </div>
    <div id="command-list" role="listbox" aria-label="Действия"></div>
    <p id="command-empty" class="note" hidden>Действия не найдены.</p>
    <footer class="command-hints"><span><kbd>↑</kbd> <kbd>↓</kbd> Выбор</span><span><kbd>↵</kbd> Открыть</span></footer>
  </dialog>
  <dialog id="chart-focus" aria-labelledby="chart-focus-title" data-glass="dense">
    <header class="drawer-head"><h2 id="chart-focus-title">График</h2>
      <form method="dialog"><button class="icon-button" type="submit" aria-label="Закрыть полноэкранный график"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></form>
    </header>
    <div id="chart-focus-body"></div>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title" data-glass="dense"></dialog>
  <dialog id="inspector" aria-labelledby="inspector-title" data-glass="dense"></dialog>
  <dialog id="appearance-dialog" aria-labelledby="appearance-title" data-glass="dense">
    <header class="drawer-head"><h2 id="appearance-title">Внешний вид</h2>
      <form method="dialog"><button class="icon-button" aria-label="Закрыть настройки внешнего вида"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></form>
    </header>
    <div class="appearance-settings">
      <label class="field" for="appearance-theme">Тема</label><select id="appearance-theme" data-preference="theme"><option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
      <label class="field" for="appearance-transparency">Прозрачность</label><select id="appearance-transparency" data-preference="transparency"><option value="full">Обычная</option><option value="reduced">Уменьшенная</option></select>
      <label class="field" for="appearance-motion">Анимация</label><select id="appearance-motion" data-preference="motion"><option value="full">Полная</option><option value="reduced">Сокращённая</option></select>
      <label class="field" for="appearance-density">Плотность</label><select id="appearance-density" data-preference="density"><option value="comfortable">Комфортная</option><option value="compact">Компактная</option></select>
      <label class="field" for="appearance-optics">Оптика блика</label><select id="appearance-optics" data-preference="optics"><option value="standard">Стандартная</option><option value="enhanced">Расширенная</option></select>
    </div>
  </dialog>
  <noscript>Включите JavaScript, чтобы открыть «Спектр».</noscript>
</body>
</html>
