name: Project CI

on:
  pull_request:
    branches:
      - main
      - curves-module
  push:
    branches:
      - main
      - curves-module

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp curves-module/.env.example curves-module/.env
      - name: Check Python
        run: make -C curves-module check-python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp curves-module/.env.example curves-module/.env
      - name: Check Go
        run: make -C curves-module check-go

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp curves-module/.env.example curves-module/.env
      - name: Check frontend
        run: make -C curves-module check-frontend

  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # setup-python@v6 declares this input; WebStorm may use stale action metadata.
          # noinspection UndefinedParamsPresent
          python-version: '3.12'
      - name: Install calculator dependencies
        run: python -m pip install -e './calculator/cf-normalizer[dev]'
      - name: Build and check C++ calculator
        run: |
          cmake -S calculator -B calculator/build -DCMAKE_BUILD_TYPE=Release
          cmake --build calculator/build -j2
          ctest --test-dir calculator/build --output-on-failure
      - name: Check Python calculator and curves integration
        env:
          CFCORE_BIN: ${{ github.workspace }}/calculator/build/core/cfcore
        run: python -m pytest calculator/cf-normalizer/tests -q

  check:
    if: ${{ always() }}
    needs: [python, go, frontend, calculator]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CALCULATOR_RESULT: ${{ needs.calculator.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$GO_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CALCULATOR_RESULT" = success
