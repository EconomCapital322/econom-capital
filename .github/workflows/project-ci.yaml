name: Project CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp .env.example .env
      - name: Check Python
        run: make check-python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp .env.example .env
      - name: Check Go
        run: make check-go

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local check environment
        run: cp .env.example .env
      - name: Check frontend
        run: make check-frontend

  check:
    if: ${{ always() }}
    needs: [python, go, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$GO_RESULT" = success
          test "$FRONTEND_RESULT" = success
