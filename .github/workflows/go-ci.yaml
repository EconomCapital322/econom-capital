name: Go CI

on:
  pull_request:
    branches:
      - main
      - curves-module

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: curves-module/stress/go.mod
          cache-dependency-path: curves-module/stress/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: curves-module/stress
          install-only: true

      - name: Lint
        working-directory: curves-module/stress
        run: golangci-lint run --config=.golangci.yaml --timeout=5m

      - name: Check formatting
        working-directory: curves-module/stress
        run: |
          format_diff="$(golangci-lint fmt --diff --color=never --config=.golangci.yaml)"
          if [[ -n "$format_diff" ]]; then
            printf '%s\n' "$format_diff"
            exit 1
          fi

      - name: Check base module formatting and vet
        working-directory: curves-module/base
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
