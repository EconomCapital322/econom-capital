name: irrbb-backend-final-demo
services:
  postgres-demo:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: irrbb_demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: irrbb_backend_demo
    command: ["postgres", "-c", "irrbb.demo_instance=backend-final"]
    ports:
      - "127.0.0.1::5432"
    volumes:
      - final-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrbb_demo -d irrbb_backend_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  final-demo-data:
