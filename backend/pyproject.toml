[project]
name = "irrbb-curves-backend"
version = "0.1.0"
description = "IRRBB curve storage and database infrastructure"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "simplejson>=3.19,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/web"]

[tool.hatch.build.targets.wheel.force-include]
"log-config.json" = "core/log-config.json"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.15,<3",
    "asyncpg-stubs>=0.30",
    "types-simplejson>=3.19",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

