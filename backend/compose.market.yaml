name: irrbb-moex-local
services:
  postgres-market:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: irrbb_market
      POSTGRES_PASSWORD: local-market-only
      POSTGRES_DB: irrbb_moex
    ports:
      - "127.0.0.1::5432"
    volumes:
      - moex-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrbb_market -d irrbb_moex"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  moex-local-data:
