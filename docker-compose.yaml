services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: always

  migrate:
    image: curves-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app/backend
    env_file:
      - ./.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: curves-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app/backend
    command:
      - uvicorn
      - web.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    env_file:
      - ./.env
    volumes:
      - ./backend:/app/backend
    ports:
      - "${API_BIND_ADDRESS:?Set API_BIND_ADDRESS in .env}:${API_PORT:?Set API_PORT in .env}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  worker:
    image: curves-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app/backend
    command: ["python", "-m", "web.processes.calculation_worker"]
    env_file:
      - ./.env
    environment:
      WORKER_READY_FILE: /run/worker/ready
    tmpfs:
      - /run/worker
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      stress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/worker/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  stress:
    image: curves-stress:local
    build:
      context: .
      dockerfile: docker/stress.Dockerfile
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

  frontend:
    image: curves-frontend:local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    working_dir: /app/frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_MODE: ${VITE_API_MODE:?Set VITE_API_MODE in .env}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
      API_PROXY_TARGET: ${API_PROXY_TARGET:?Set API_PROXY_TARGET in .env}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
       - "${FRONTEND_BIND_ADDRESS}:${FRONTEND_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  postgres-test:
    profiles: ["check"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: irrbb_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: irrbb_stage2_test
    command: ["postgres", "-c", "irrbb.test_instance=stage2"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrbb_test -d irrbb_stage2_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-check:
    profiles: ["check"]
    build:
      context: .
      dockerfile: docker/checks.Dockerfile
    working_dir: /app
    environment:
      IRRBB_TEST_ADMIN_DSN: postgresql://irrbb_test:local-test-only@postgres-test:5432/irrbb_stage2_test
      DATABASE__DSN: postgresql://irrbb_test:local-test-only@postgres-test:5432/irrbb_stage2_test

volumes:
  pg_data:
  frontend_node_modules:
